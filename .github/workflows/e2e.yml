name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine # same as compose.yaml
        env:
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: accountant
          POSTGRES_DB: accountant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accountant -d accountant"
          --health-interval 2s --health-timeout 5s --health-retries 30

    env:
      # scripts/e2e-server.ts creates and migrates accountant_e2e from this.
      DATABASE_URL: postgres://accountant:accountant@localhost:5432/accountant

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Playwright's runner is Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
